services:

  db:
    hostname: db
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 1s
      retries: 5

  backend:
    hostname: backend
    build:
      context: ./back-end
      dockerfile: Dockerfile.prod
    volumes:
      - django-static:/var/www/static
      - django-media:/var/www/media
    ports:
      - "8000:8000"

volumes:
  pgdata:
  django-static:
  django-media:
