services:

  db:
    hostname: db
    image: postgres:16
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 1s
      retries: 5
    networks:
      - sous-chef

  backend:
    hostname: backend
    restart: unless-stopped
    build:
      context: ./back-end
      dockerfile: Dockerfile.prod
    volumes:
      - django-static:/var/www/static
      - django-media:/var/www/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sous-chef

  caddy:
    hostname: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./front-end/dist:/usr/share/nginx/html:ro
      - django-static:/var/www/static:ro
      - django-media:/var/www/media:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks:
      - sous-chef

networks:
  sous-chef:
    driver: bridge

volumes:
  pgdata:
  django-static:
  django-media:
  caddy-data:
  caddy-config:
