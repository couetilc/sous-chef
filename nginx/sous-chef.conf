# --- Upstreams ---
upstream django_upstream {
    server backend:8000;
    keepalive 64;
}

# --- HTTP (80) for souschef.life and www.souschef.life ---
# - Serve ACME challenges (if using Certbot HTTP-01)
# - Redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name souschef.life www.souschef.life;

    # ACME challenge endpoint (Certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

