user  nginx;
worker_processes  auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  # gzip can be enabled for better perf
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream django_upstream {
    server backend:8000;
    keepalive 64;
  }

  upstream vite_upstream {
    server frontend:5173;
    keepalive 64;
  }

  server {
    listen 3000;
    server_name _;

    # Serve Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # Django static & media
    location /static/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://django_upstream$request_uri;
    }

    location /media/ {
      alias /var/www/media/;
      access_log off;
      expires 7d;
    }

    # Proxy API to Django (Gunicorn)
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://django_upstream$request_uri;
    }

    # Admin can be proxied too (optional but handy)
    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://django_upstream$request_uri;
    }

    # History API fallback for SPA: anything not /api|/static|/media is index.html
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://vite_upstream$request_uri;
    }
  }
}

