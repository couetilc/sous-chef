services:
  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - '5001:80'
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  db:
    hostname: db
    image: postgres:16
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 1s
      retries: 5

  backend:
    hostname: backend
    build:
      context: ./back-end
      dockerfile: Dockerfile
    volumes:
      - ./back-end:/app
      - ./scraping:/scraping
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DJANGO_DB_NAME: "api"
      DJANGO_DB_USER: "dbuser"
      DJANGO_DB_PASSWORD: "dbpass"
      DJANGO_DB_HOST: "db"
      DJANGO_DB_PORT: "5432"
      DJANGO_SERVER_IP: "0.0.0.0"
      DJANGO_SERVER_PORT: "8000"
      DJANGO_DEBUG: "True"

  frontend:
    hostname: frontend
    build:
      context: ./front-end
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - /app/node_modules  # Anonymous volume - uses node_modules from image build

  caddy:
    hostname: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  pip-cache:
  pnpm-store:
  smtp4dev-data:
