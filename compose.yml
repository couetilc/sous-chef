services:

  db:
    hostname: db
    image: postgres:16
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 1s
      retries: 5

  backend:
    hostname: backend
    build:
      context: ./back-end
      dockerfile: Dockerfile
    volumes:
      - ./back-end:/app
      - ./scraping:/scraping
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DB_NAME: "api"
      DJANGO_DB_USER: "dbuser"
      DJANGO_DB_PASSWORD: "dbpass"
      DJANGO_DB_HOST: "db"
      DJANGO_DB_PORT: "5432"
      DJANGO_SERVER_IP: "0.0.0.0"
      DJANGO_SERVER_PORT: "8000"

  frontend:
    hostname: frontend
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - node_modules:/app/node_modules

  nginx:
    hostname: nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  devcontainer:
    hostname: devcontainer
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Mount entire workspace for editing
      - .:/workspace:cached
      # Use named volumes for dependencies (performance optimization)
      - pip-cache:/root/.cache/pip
      - pnpm-store:/root/.local/share/pnpm/store
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Make services discoverable
      DATABASE_URL: "postgresql://dbuser:dbpass@db:5432/api"
      BACKEND_URL: "http://backend:8000"
      FRONTEND_URL: "http://frontend:5173"

volumes:
  pgdata:
  node_modules:
  pip-cache:
  pnpm-store:
