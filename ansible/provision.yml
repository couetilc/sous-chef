---
# Provision playbook - Initial server setup
# Run this once after Terraform creates the infrastructure
# Usage: ansible-playbook provision.yml

- name: Provision Sous Chef Server
  hosts: production
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300

    - name: Gather facts
      setup:

  roles:
    - role: common
      tags: [common, base]

    - role: docker
      tags: [docker]

  post_tasks:
    - name: Reboot if required
      reboot:
        msg: "Reboot initiated by Ansible for kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: ansible_facts.packages is defined
      tags: [reboot]
