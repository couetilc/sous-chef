---
- name: Deploy Sous Chef production stack
  hosts: ec2
  become: yes
  tasks:
    - name: Copy .env file to remote host
      copy:
        src: ../.env
        dest: /home/ec2-user/sous-chef/.env
        owner: ec2-user
        group: ec2-user
        mode: '0600'

    - name: Pull latest changes from git
      git:
        repo: git@github.com:couetilc/sous-chef.git
        dest: /home/ec2-user/sous-chef
        update: yes
      become_user: ec2-user

    - name: Start production docker compose stack
      command:
        cmd: docker compose -f compose.prod.yml up -d --build
        chdir: /home/ec2-user/sous-chef
      become_user: ec2-user
