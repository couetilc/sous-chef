[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = api config
addopts =
    --verbose
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    oauth: OAuth2 related tests
    slow: Slow running tests
